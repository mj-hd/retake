[[permission]]
identifier = "allow-installer-status"
description = "Read which MCP clients have Retake installed."
commands.allow = ["installer_status"]

[[permission]]
identifier = "allow-install-clients"
description = "Install Retake into selected MCP clients."
commands.allow = ["install_clients"]

[[permission]]
identifier = "allow-remove-clients"
description = "Remove Retake from selected MCP clients."
commands.allow = ["remove_clients"]

[[permission]]
identifier = "allow-open-claude-skills"
description = "Open Claude's Skills settings page."
commands.allow = ["open_claude_skills"]

[[permission]]
identifier = "allow-restart-client"
description = "Restart a supported desktop MCP client."
commands.allow = ["restart_client"]

[[permission]]
identifier = "allow-quit-app"
description = "Quit the Retake desktop application."
commands.allow = ["quit_app"]
