[package]
name = "retake-desktop"
version = "0.1.1"
description = "Retake desktop review host"
authors = ["retake"]
license = "MIT"
repository = "https://github.com/mj-hd/retake"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "retake_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
retake-server = { path = "../../crates/retake-server" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.1", features = [] }
toml_edit = "0.22"
tokio = { version = "1", features = ["rt-multi-thread"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = "3"
