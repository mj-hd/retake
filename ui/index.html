<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#191A20" />
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <title>Retake Review</title>
    <script>
      let storedTheme = null;
      try {
        const stored = localStorage.getItem('retake.theme');
        if (stored === 'light' || stored === 'dark') storedTheme = stored;
      } catch {}
      const theme = storedTheme ?? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = theme;
      document.documentElement.style.colorScheme = theme;
      document.querySelector('meta[name="theme-color"]').content = theme === 'light' ? '#F4F4F6' : '#191A20';
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
