name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: linux-x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: linux-aarch64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            asset: macos-x86_64
          - runner: macos-15
            target: aarch64-apple-darwin
            asset: macos-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build UI
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Build server
        run: cargo build --locked --release --target "${{ matrix.target }}" -p retake-server

      - name: Package
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
        run: |
          set -eux
          package="retake-${ASSET}"
          mkdir -p staging/retake/bin staging/retake/ui staging/retake/workers/web-capture dist
          cp "target/${TARGET}/release/retake" staging/retake/bin/retake
          cp -R ui/dist staging/retake/ui/dist
          cp workers/web-capture/*.js staging/retake/workers/web-capture/
          cp workers/web-capture/package.json workers/web-capture/package-lock.json staging/retake/workers/web-capture/
          cp README.md README.ja.md staging/retake/
          tar -czf "dist/${package}.tar.gz" -C staging retake
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "${package}.tar.gz" > "${package}.tar.gz.sha256")
          else
            (cd dist && shasum -a 256 "${package}.tar.gz" > "${package}.tar.gz.sha256")
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: retake-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: retake-*
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
