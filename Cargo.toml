[workspace]
members = [
    "crates/retake-core",
    "crates/retake-store",
    "crates/retake-renderers",
    "crates/retake-server",
]
exclude = ["ui/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "MIT"
authors = ["retake"]
rust-version = "1.75"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
axum = { version = "0.7", features = ["macros", "ws"] }
tower-http = { version = "0.5", features = ["fs", "trace", "cors"] }
tower = "0.4"
hyper = "1"
image = { version = "0.25", features = ["png", "jpeg", "webp"] }
kamadak-exif = "0.5"
ab_glyph = "0.2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tempfile = "3"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
parking_lot = "0.12"
tokio-util = "0.7"
futures = "0.3"
